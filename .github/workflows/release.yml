name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Musl Binary & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Vajra (Release)
        working-directory: ./vajra-phase7.1/vajra
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package Tarball & Checksum
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p release/vajra
          cp vajra-phase7.1/vajra/target/x86_64-unknown-linux-musl/release/vajra release/vajra/
          chmod 755 release/vajra/vajra
          
          # Tarball बनाएं
          tar -czf release/vajra-${TAG_NAME}-x86_64-linux.tar.gz -C release vajra
          
          # Checksum बनाएं
          cd release
          sha256sum vajra-${TAG_NAME}-x86_64-linux.tar.gz > vajra-${TAG_NAME}-x86_64-linux.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/vajra-*.tar.gz
            release/vajra-*.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
