[package]
name = "vajra"
version = "0.14.4"
edition = "2021"
rust-version = "1.80"
description = "Vajra: a thread-per-core, io_uring based web server"
license = "MIT OR Apache-2.0"

[lib]
name = "vajra"
path = "src/lib.rs"

[[bin]]
name = "vajra"
path = "src/main.rs"

[dependencies]
cron = "0.12"
flate2 = "1"
brotli = "7"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
getrandom = "0.2"
# io_uring bindings (tokio-rs). We drive the ring ourselves: no async runtime.
io-uring = "0.7"
# Raw syscalls / constants.
libc = "0.2"
# Zero-allocation HTTP/1.x parser (requests from clients, responses from upstreams).
httparse = "1.9"
# Socket construction (SO_REUSEPORT, TCP_NODELAY, SockAddr for connect).
socket2 = { version = "0.5", features = ["all"] }
# Config file.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# TLS: rustls is sans-I/O, which is exactly what an io_uring loop wants.
# The `ring` provider avoids needing cmake/NASM to build aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# QUIC: quinn-proto is the sans-I/O QUIC state machine (no sockets, no runtime), so the
# UDP I/O and timers stay on our io_uring loop. HTTP/3 + QPACK framing is in src/h3.rs.
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
bytes = "1"
# HPACK *decoder* (Huffman + dynamic table). The encoder is hand-written in h2.rs.
hpack = { package = "hpack-patched", version = "0.3.0" }
ipnet = "2.12.2"
tar = "0.4.46"
zstd = "0.14.2"
tempfile = "3.27.0"
rust-s3 = { version = "0.38.0", default-features = false, features = ["blocking", "tokio-rustls-tls"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[dev-dependencies]
# Self-signed certificates for the TLS / HTTP/2 end-to-end tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
debug = 1

[profile.bench]
inherits = "release"
