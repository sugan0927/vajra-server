name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles("**/Cargo.lock") }}

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          DIR="vajra-${VERSION}-x86_64-linux"
          mkdir -p "${DIR}"
          cp target/release/vajra "${DIR}/"
          cp install.sh docs/wp-cli.md docs/backup.md docs/check.md docs/setup.md "${DIR}/"
          cp CHANGELOG.md README.md SECURITY.md "${DIR}/"
          tar -czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vajra-*.tar.gz
            vajra-*.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
